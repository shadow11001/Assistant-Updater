name: Build Windows Release

on:
  push:
    tags:
      - 'v*' # Trigger workflow on version tags (e.g. v1.0.0)
  workflow_dispatch: # Allows manual trigger from Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required to modify and push branches/tags

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Using a recent Go version
          cache: false # Disable caching because this app has no external dependencies (no go.sum)

      - name: Generate Encrypted Keys
        id: encrypt_keys
        run: |
          go run cmd/encrypt_token/main.go "${{ secrets.UPDATER_GITHUB_TOKEN }}" > crypto_output.txt
          
          # Extract values generated by your helper
          export HEX_KEY=$(grep 'Key:' crypto_output.txt | awk '{print $2}')
          export HEX_NONCE=$(grep 'Nonce:' crypto_output.txt | awk '{print $2}')
          export HEX_CIPHER=$(grep 'Ciphertext:' crypto_output.txt | awk '{print $2}')
          
          # Use sed to securely inject them into crypto.go before building
          sed -i "s/replace_with_32_byte_hex_key/$HEX_KEY/g" crypto.go
          sed -i "s/replace_with_12_byte_hex_nonce/$HEX_NONCE/g" crypto.go
          sed -i "s/replace_with_hex_ciphertext/$HEX_CIPHER/g" crypto.go

      - name: Build Windows Executable
        run: |
          # Build a hidden-window GUI executable for Windows, injecting the release tag as the appVersion
          # Force CGO_ENABLED=0 to ensure pure static windows executable without external dependencies
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-X main.appVersion=${{ github.ref_name }} -H windowsgui -s -w" -o updater.exe .
          zip updater.zip updater.exe
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          files: updater.zip